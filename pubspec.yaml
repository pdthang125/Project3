name: expense_tracker
description: OCR Expense Tracker and Receipt Parser - A Flutter app for scanning receipts with OCR.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  image_cropper: ^7.0.1

  # OCR - On-Device, Offline
  google_mlkit_text_recognition: ^0.13.0

  # Local Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Image processing / thumbnail
  image: ^4.2.0
  flutter_image_compress: ^2.3.0

  # Permissions
  permission_handler: ^11.3.1

  # UI & Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  google_fonts: ^6.2.1
  sqflite_common_ffi: ^2.3.5
  sqflite_common_ffi_web: ^0.4.3+1
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
